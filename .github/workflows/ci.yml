name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22.0', '1.23.x', '1.24.x', '1.25.x', '1.26.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install Redis for distributed limiter tests
        run: |
          if ! command -v redis-server >/dev/null || ! command -v redis-cli >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y redis-server
          fi
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go test ./...
      - run: go test -race ./...
      - run: go test ./...
        working-directory: dave-go
      - run: go vet ./...
        working-directory: dave-go
      - name: Test runnable bot templates
        run: |
          for template in auditbot musicbot recorderbot; do
            (cd "docs/examples/templates/$template" && go test ./...)
          done
      - run: go test ./...
        working-directory: dave-go/mls-go
      - run: go vet ./...
        working-directory: dave-go/mls-go
      - run: go test ./...
        working-directory: dave-go/godave
      - run: go vet ./...
        working-directory: dave-go/godave
      - run: go vet ./...

  test-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Test core modules and audit bot
        shell: bash
        run: |
          set -euo pipefail
          for module in . dave-go dave-go/mls-go dave-go/godave docs/examples/templates/auditbot; do
            go -C "$module" test ./...
          done

  test-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.0'
      - name: Install Redis for distributed limiter tests
        run: |
          if ! command -v redis-server >/dev/null || ! command -v redis-cli >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y redis-server
          fi
      - name: Test 32-bit root and nested modules
        env:
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for module in . dave-go dave-go/mls-go dave-go/godave; do
            (cd "$module" && go test ./...)
          done
