name: API coverage inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.0'
      - name: Compare referenced route helpers with Discord's OpenAPI paths
        run: go run ./scripts/api_coverage | tee -a "$GITHUB_STEP_SUMMARY"
